name: Verificar reto final

# Se usa pull_request_target para poder comentar en los Pull Requests que vienen
# de forks. Por seguridad, este workflow NUNCA descarga ni ejecuta el código del
# Pull Request: usa el script de la rama main y solo lee datos públicos.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: write   # para agregar a los alumnos completos a la lista
  issues: write
  pull-requests: write

jobs:
  verificar:
    # No revisa los Pull Requests de dueños, miembros de la organización ni colaboradores
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el script de main (no el código del Pull Request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Revisar evidencias del alumno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 .github/scripts/verificar_reto.py pr
